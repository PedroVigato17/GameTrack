<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameTrack - Biblioteca de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>GAME TRACK</h1>
        <p>Sua biblioteca de jogos</p>
    </header>

    <main>
        <section id="dashboard">
            <div class="card-indicador">
                <span id="total-jogos">0</span>
                <p>Jogos cadastrados</p>
            </div>
            <div class="card-indicador">
                <span id="total-jogando">0</span>
                <p>Jogando</p>
            </div>
            <div class="card-indicador">
                <span id="total-finalizados">0</span>
                <p>Finalizados</p>
            </div>
        </section>

        <section id="secao-formulario">
            <h2>Cadastrar Novo Jogo</h2>
            <form id="form-jogo">
                <input type="hidden" id="jogo-id">

                <div class="campo">
                    <label for="titulo">Título:</label>
                    <input type="text" id="titulo" placeholder="Ex: Minecraft" required>
                </div>

                <div class="campo">
                    <label for="genero">Gênero:</label>
                    <input type="text" id="genero" placeholder="Ex: Sandbox" required>
                </div>

                <div class="campo">
                    <label for="plataforma">Plataforma:</label>
                    <input type="text" id="plataforma" placeholder="Ex: PC, Xbox, PS5" required>
                </div>

                <div class="campo">
                    <label for="nota">Nota (0 a 10):</label>
                    <input type="number" id="nota" min="0" max="10" step="0.1" placeholder="Ex: 9" required>
                </div>

                <div class="campo">
                    <label for="status">Status:</label>
                    <select id="status" required>
                        <option value="">Selecione...</option>
                        <option value="Quero jogar">Quero jogar</option>
                        <option value="Jogando">Jogando</option>
                        <option value="Finalizado">Finalizado</option>
                        <option value="Abandonado">Abandonado</option>
                    </select>
                </div>

                <button type="submit" id="btn-salvar">Salvar Jogo</button>
            </form>
        </section>

        <section id="controles">
            <input type="text" id="pesquisa" placeholder="Pesquisar jogo por título...">
            
            <select id="filtro-status">
                <option value="Todos">Todos os Status</option>
                <option value="Quero jogar">Quero jogar</option>
                <option value="Jogando">Jogando</option>
                <option value="Finalizado">Finalizado</option>
                <option value="Abandonado">Abandonado</option>
            </select>
        </section>

        <section id="secao-lista">
            <h2>Meus Jogos</h2>
            <div id="lista-jogos"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
